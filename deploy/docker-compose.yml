version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://videoenglish:videoenglish@postgres:5432/videoenglish}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      LOCAL_AUTO_USER: ${LOCAL_AUTO_USER:-0}
      INLINE_WORKER: ${INLINE_WORKER:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ../:/app

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python -m app.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://videoenglish:videoenglish@postgres:5432/videoenglish}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      LOCAL_AUTO_USER: ${LOCAL_AUTO_USER:-0}
      INLINE_WORKER: 0
    depends_on:
      - postgres
      - redis
    volumes:
      - ../:/app

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: videoenglish
      POSTGRES_USER: videoenglish
      POSTGRES_PASSWORD: videoenglish
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pg_data:
