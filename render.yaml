services:
  - type: web
    name: wordpop
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_MODE
        value: web
      - key: LOCAL_AUTO_USER
        value: "0"
      - key: INLINE_WORKER
        value: "1"
      - key: APP_NAME
        value: WordPop 单词泡泡
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wordpop-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: pserv
    name: wordpop-db
    plan: free
    databaseName: wordpop
    user: wordpop
