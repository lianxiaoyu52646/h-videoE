# Render Blueprint — Web on Render + Neon (user data only)
# Word content: curated JSON on disk. ECDICT: dictionary.db / ecdict.csv on disk.
services:
  - type: web
    name: wordpop
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/ensure_dictionary_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_MODE
        value: web
      - key: LOCAL_AUTO_USER
        value: "0"
      - key: INLINE_WORKER
        value: "1"
      - key: AUTO_INSTALL_WORDBOOKS
        value: "1"
      - key: APP_NAME
        value: WordPop 单词泡泡
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
