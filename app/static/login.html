<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF5C8A" />
  <title>登录 — WordPop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body class="auth-page">
  <div class="auth-blobs" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <main class="auth-shell">
    <header class="auth-brand">
      <div class="auth-logo" aria-hidden="true">🫧</div>
      <h1>WordPop</h1>
      <p>单词泡泡 · 青春卡通学英语</p>
    </header>

    <section class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-switch-btn active" data-mode="login" role="tab">登录</button>
        <button type="button" class="auth-switch-btn" data-mode="register" role="tab">注册</button>
      </div>

      <div id="authStatus" class="auth-status" aria-live="polite"></div>

      <section class="auth-panel" data-mode="login">
        <form id="loginForm" autocomplete="on">
          <div class="auth-field">
            <label for="loginUsername">用户名</label>
            <input id="loginUsername" name="username" type="text" placeholder="输入用户名" required minlength="2" maxlength="32" autocomplete="username" />
          </div>
          <div class="auth-field">
            <label for="loginPassword">密码</label>
            <input id="loginPassword" name="password" type="password" placeholder="输入密码" required minlength="6" autocomplete="current-password" />
          </div>
          <button class="auth-submit" type="submit">进入 WordPop</button>
        </form>
      </section>

      <section class="auth-panel hidden" data-mode="register">
        <form id="registerForm" autocomplete="on">
          <div class="auth-field">
            <label for="regUsername">用户名</label>
            <input id="regUsername" name="username" type="text" placeholder="2–32 位，中英文/数字/下划线" required minlength="2" maxlength="32" autocomplete="username" />
          </div>
          <div class="auth-field">
            <label for="regPassword">密码</label>
            <input id="regPassword" name="password" type="password" placeholder="至少 6 位" required minlength="6" autocomplete="new-password" />
          </div>
          <button class="auth-submit" type="submit">注册并开始</button>
        </form>
      </section>
    </section>
  </main>

  <script src="/static/js/login.js"></script>
</body>
</html>
