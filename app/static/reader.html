<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阅读器 — VideoEnglish</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="reader-page">
  <header class="reader-topbar">
    <div class="reader-topbar-inner">
      <div class="reader-topbar-left">
        <a href="/read" class="reader-back" title="返回书库"><span class="reader-back-icon">←</span><span>书库</span></a>
        <div class="reader-title-wrap">
          <h1 id="readerTitle" class="reader-topbar-title">加载中...</h1>
        </div>
      </div>
      <div class="reader-topbar-center reader-progress-clickable" id="progressClickArea" title="点击跳转到进度位置">
        <span id="readProgressText" class="reader-segment-info">0 / 0 段</span>
        <div class="reader-progress-bar"><div id="readProgressFill" class="reader-progress-fill"></div></div>
      </div>
      <div class="reader-topbar-right-wrap">
        <div id="vocabStatsBar" class="reader-vocab-stats hidden">
          <span id="vocabStatsText" class="reader-vocab-count">本文 0 生词</span>
          <div class="reader-vocab-links">
            <a id="vocabReviewLink" class="reader-vocab-link" href="#">去复习</a>
          </div>
        </div>
        <div class="reader-topbar-right">
          <button id="toggleSearch" class="reader-icon-btn" title="搜索 (/)">🔍</button>
          <button id="toggleBookmarks" class="reader-icon-btn" title="书签 (B)">🔖</button>
          <button id="toggleToc" class="reader-icon-btn" title="目录 (T)">📑</button>
          <button id="toggleNotes" class="reader-icon-btn" title="笔记 (N)">📝</button>
          <button id="toggleSettings" class="reader-icon-btn" title="设置">⚙️</button>
        </div>
      </div>
    </div>
  </header>

  <div id="searchBar" class="reader-search-bar hidden">
    <input id="searchInput" type="search" placeholder="搜索本文… (Enter 下一个，Shift+Enter 上一个)" autocomplete="off" />
    <span id="searchStatus" class="reader-search-status"></span>
    <button id="searchPrev" class="btn-secondary btn-sm" title="上一个">↑</button>
    <button id="searchNext" class="btn-secondary btn-sm" title="下一个">↓</button>
    <button id="closeSearch" class="btn-secondary btn-sm">✕</button>
  </div>

  <div id="translateBanner" class="reader-translate-banner hidden"></div>

  <div id="settingsPanel" class="reader-settings hidden">
    <div class="reader-settings-header">
      <h3>阅读设置</h3>
      <button id="closeSettings" class="btn-secondary btn-sm" type="button" aria-label="关闭设置">✕</button>
    </div>
    <div class="reader-settings-inner">
      <label>显示模式
        <select id="displayMode">
          <option value="both">中英双语</option>
          <option value="en">仅英文</option>
          <option value="zh">仅中文</option>
        </select>
      </label>
      <label>字号
        <span class="reader-font-controls">
          <button id="fontSmaller" class="btn-secondary btn-icon">A-</button>
          <span id="fontSizeLabel">18</span>
          <button id="fontBigger" class="btn-secondary btn-icon">A+</button>
        </span>
      </label>
      <label>朗读
        <span>
          <button id="ttsToggle" class="btn-secondary btn-sm">🔊 开始</button>
          <button id="stopTts" class="btn-secondary btn-sm hidden">⏹ 停止</button>
        </span>
      </label>
      <label>阅读主题
        <select id="readerTheme">
          <option value="dark">深色</option>
          <option value="light">浅色</option>
          <option value="sepia">护眼</option>
        </select>
      </label>
    </div>
  </div>

  <div id="statusMsg" class="reader-toast hidden"></div>

  <div class="reader-layout">
    <main class="reader-main">
      <div class="reader-paper">
        <nav id="chapterNav" class="reader-chapter-nav hidden">
          <button id="prevChapterBtn" type="button" class="btn-secondary btn-sm reader-chapter-btn">← 上一章</button>
          <div class="reader-chapter-meta">
            <span id="chapterNavLabel" class="reader-chapter-label">第 1 / 1 章</span>
            <span id="chapterNavTitle" class="reader-chapter-subtitle"></span>
          </div>
          <button id="nextChapterBtn" type="button" class="btn-secondary btn-sm reader-chapter-btn">下一章 →</button>
        </nav>
        <article id="blockList" class="reading-flow"></article>
      </div>
    </main>

    <aside id="tocPanel" class="reader-side-panel hidden">
      <div class="notes-panel-header">
        <h3>📑 目录</h3>
        <button id="closeToc" class="btn-secondary btn-sm">✕</button>
      </div>
      <div id="tocList" class="toc-list"></div>
    </aside>

    <aside id="bookmarksPanel" class="reader-side-panel hidden">
      <div class="notes-panel-header">
        <h3>🔖 书签</h3>
        <button id="closeBookmarks" class="btn-secondary btn-sm">✕</button>
      </div>
      <div class="bookmarks-actions">
        <button id="addBookmarkBtn" class="btn-primary btn-sm">在当前位置添加书签</button>
      </div>
      <div id="bookmarksList" class="bookmarks-list"></div>
    </aside>

    <aside id="notesPanel" class="reader-side-panel hidden">
      <div class="notes-panel-header">
        <h3>📝 笔记</h3>
        <button id="closeNotes" class="btn-secondary btn-sm">✕</button>
      </div>
      <div id="notesList" class="notes-list"></div>
      <div class="notes-add">
        <textarea id="newNoteText" placeholder="添加笔记..." rows="3"></textarea>
        <button id="addNoteBtn" class="btn-primary btn-sm">添加</button>
      </div>
    </aside>
  </div>

  <div id="selectionToolbar" class="selection-toolbar hidden">
    <button id="lookupSelectionBtn" class="btn-primary btn-sm">📖 查词</button>
    <span class="hl-color-picker" title="高亮颜色">
      <button class="hl-color-btn active" data-color="yellow" style="--hl-dot:#fbbf24"></button>
      <button class="hl-color-btn" data-color="green" style="--hl-dot:#4ade80"></button>
      <button class="hl-color-btn" data-color="blue" style="--hl-dot:#60a5fa"></button>
      <button class="hl-color-btn" data-color="pink" style="--hl-dot:#f472b6"></button>
    </span>
    <button id="highlightBtn" class="btn-secondary btn-sm">🖍 高亮</button>
    <button id="noteSelectionBtn" class="btn-secondary btn-sm">📝 笔记</button>
  </div>

  <div id="highlightNoteTip" class="highlight-note-tip hidden"></div>

  <div id="onboardingOverlay" class="reader-onboarding hidden">
    <div class="reader-onboarding-card">
      <div class="reader-onboarding-step" data-step="1">
        <div class="reader-onboarding-num">1</div>
        <h3>点击单词查释义</h3>
        <p>阅读英文时，点击任意单词即可弹出释义卡片。</p>
      </div>
      <div class="reader-onboarding-step hidden" data-step="2">
        <div class="reader-onboarding-num">2</div>
        <h3>收藏到生词本</h3>
        <p>在弹窗中点击 ⭐ 收藏，单词会加入 FSRS 复习队列。</p>
      </div>
      <div class="reader-onboarding-step hidden" data-step="3">
        <div class="reader-onboarding-num">3</div>
        <h3>复习本文生词</h3>
        <p>顶栏会显示本文生词数，点击「去复习」即可专项练习。</p>
      </div>
      <div class="reader-onboarding-actions">
        <button id="onboardingSkip" class="btn-secondary btn-sm">跳过</button>
        <button id="onboardingNext" class="btn-primary btn-sm">下一步</button>
      </div>
    </div>
  </div>

  <div id="shortcutsOverlay" class="reader-shortcuts-overlay hidden">
    <div class="reader-shortcuts-card">
      <div class="reader-shortcuts-header">
        <h3>⌨️ 快捷键</h3>
        <button id="closeShortcuts" class="btn-secondary btn-sm">✕</button>
      </div>
      <dl class="reader-shortcuts-list">
        <dt><kbd>j</kbd> / <kbd>↓</kbd></dt><dd>下一段</dd>
        <dt><kbd>k</kbd> / <kbd>↑</kbd></dt><dd>上一段</dd>
        <dt><kbd>/</kbd></dt><dd>打开搜索</dd>
        <dt><kbd>Ctrl</kbd>+<kbd>F</kbd></dt><dd>打开搜索</dd>
        <dt><kbd>b</kbd></dt><dd>添加书签</dd>
        <dt><kbd>t</kbd></dt><dd>目录</dd>
        <dt><kbd>n</kbd></dt><dd>笔记</dd>
        <dt><kbd>?</kbd></dt><dd>快捷键帮助</dd>
        <dt><kbd>Esc</kbd></dt><dd>关闭弹层</dd>
      </dl>
    </div>
  </div>

  <div id="wordPopover" class="word-popover hidden">
    <button class="word-popover-close" id="closePopover">✕</button>
    <div id="wordPopoverBody" class="word-popover-body">
      <div class="word-popover-loading">查询中...</div>
    </div>
    <div class="word-popover-actions">
      <button id="speakWordBtn" class="btn-secondary btn-sm">🔊</button>
      <button id="saveWordBtn" class="btn-primary btn-sm">⭐ 收藏</button>
      <button id="expandWordBtn" class="btn-secondary btn-sm hidden">详情</button>
    </div>
  </div>

  <script src="/static/js/session.js"></script>
  <script src="/static/js/reader.js"></script>
</body>
</html>
