<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoEnglish Desktop</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Inter, "Segoe UI", sans-serif;
    }
    .boot {
      text-align: center;
      max-width: 420px;
      padding: 32px;
    }
    .boot h1 {
      margin: 0 0 12px;
      color: #38bdf8;
    }
    .boot p {
      margin: 0;
      color: #94a3b8;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="boot">
    <h1>VideoEnglish</h1>
    <p>桌面壳正在连接本地学习引擎。如果你看到这个页面持续不消失，请检查 sidecar 是否已成功启动。</p>
  </div>
</body>
</html>
