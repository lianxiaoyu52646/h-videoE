<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; padding: 16px; margin: 0; background: #0f172a; color: #e2e8f0; }
    h2 { margin: 0 0 12px; font-size: 16px; color: #38bdf8; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; box-sizing: border-box; }
    button { margin-top: 12px; width: 100%; padding: 10px; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: 700; cursor: pointer; }
    p { font-size: 12px; color: #94a3b8; line-height: 1.5; }
    .ok { color: #34d399; font-size: 12px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <h2>VideoEnglish</h2>
  <p>打开 YouTube 或 B站 视频，点击页面右侧「学」按钮开始。</p>
  <label>后端 API 地址</label>
  <input id="apiBase" type="text" value="http://127.0.0.1:8000" />
  <label style="margin-top:10px">扩展令牌（云端模式必填）</label>
  <input id="apiToken" type="password" value="" placeholder="从 Web 顶部的“扩展令牌”按钮生成" />
  <button id="saveBtn">保存</button>
  <div id="ok" class="ok">已保存 ✓</div>
  <script src="popup.js"></script>
</body>
</html>
